<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leman & Zeynel ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0022 0%, #3a0038 50%, #10001e 100%);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Metin efektleri ve animasyonlar için katman */
        #textFxLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        /* Ana Kart */
        .container {
            position: relative;
            z-index: 20;
            width: 90%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 182, 193, 0.3);
            border-radius: 28px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 30px rgba(233, 30, 99, 0.25);
        }

        .header-title {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #fe9a8b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 1px;
            filter: drop-shadow(0 2px 8px rgba(233, 30, 99, 0.4));
        }

        .date-sub {
            font-size: 0.95rem;
            color: #f3d1f4;
            opacity: 0.9;
            margin-bottom: 16px;
        }

        .counter-box {
            background: rgba(233, 30, 99, 0.15);
            border: 1px dashed rgba(255, 105, 180, 0.4);
            border-radius: 16px;
            padding: 12px 15px;
            margin-bottom: 28px;
            font-size: 0.95rem;
            color: #ffe6f7;
        }

        .counter-days {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ff75ac;
            display: inline-block;
            margin: 0 4px;
        }

        .question-title {
            font-size: 1.35rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
            margin-bottom: 22px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-yes {
            background: linear-gradient(45deg, #e91e63, #ff6090);
            color: white;
        }

        .btn-yes:hover, .btn-yes:active {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.6);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.15);
            color: #fce4ec;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-no:hover, .btn-no:active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0.98);
        }

        .yes-message {
            display: none;
            margin-top: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff6090;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 0 15px rgba(255, 96, 144, 0.6);
            line-height: 1.4;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Düşen Yazı Yağmuru Animasyonu */
        .falling-text {
            position: fixed;
            top: -60px;
            color: #ff80bf;
            font-weight: bold;
            pointer-events: none;
            z-index: 6;
            white-space: nowrap;
            animation: fallAnimation linear infinite;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
        }

        @keyframes fallAnimation {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.95;
            }
            100% {
                transform: translateY(115vh) rotate(360deg);
                opacity: 0.1;
            }
        }

        /* Yazı Tabanlı Havai Fişek Parçacığı */
        .text-particle {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            font-weight: bold;
            white-space: nowrap;
            animation: explodeText 1.5s ease-out forwards;
        }

        @keyframes explodeText {
            0% {
                transform: translate(0, 0) scale(0.3);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1.2);
                opacity: 0;
            }
        }

        @media (max-width: 480px) {
            .container { padding: 28px 18px; }
            .header-title { font-size: 1.8rem; }
            .question-title { font-size: 1.2rem; }
            .btn { padding: 10px 26px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="textFxLayer"></div>

    <div class="container">
        <h1 class="header-title">Leman & Zeynel</h1>
        <p class="date-sub">Sevgili olduğumuz gün: 19 Temmuz 2026</p>

        <div class="counter-box">
            ❤️ Birlikteliğimizde <span id="daysCount" class="counter-days">0</span> gün oldu!
        </div>

        <div id="interactiveArea">
            <div id="questionBox">
                <p class="question-title">Seni sevdiğimi biliyor musun?</p>
                <div class="btn-group">
                    <button class="btn btn-yes" id="yesBtn">Evet</button>
                    <button class="btn btn-no" id="noBtn">Hayır</button>
                </div>
            </div>

            <div class="yes-message" id="yesMessage">
                Evet, seni çok seviyorum aşkım ❤️✨
            </div>
        </div>
    </div>

    <script>
        // --- 1. GÜN HESAPLAMA ---
        function updateCounter() {
            const startDate = new Date('2026-07-19T00:00:00');
            const now = new Date();
            const diffDays = Math.max(0, Math.floor((now - startDate) / (1000 * 60 * 60 * 24)));
            document.getElementById('daysCount').textContent = diffDays;
        }
        updateCounter();
        setInterval(updateCounter, 60000);

        // --- 2. HAYIR BUTONU VE RASTGELE YAZI MANTIĞI ---
        let noClickCount = 0;
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const textFxLayer = document.getElementById('textFxLayer');
        const questionBox = document.getElementById('questionBox');
        const yesMessage = document.getElementById('yesMessage');

        const fonts = [
            "'Segoe UI', sans-serif",
            "Georgia, serif",
            "'Courier New', monospace",
            "Trebuchet MS, sans-serif",
            "Verdana, sans-serif",
            "Comic Sans MS, cursive",
            "Impact, sans-serif"
        ];

        const colors = [
            "#ff75ac", "#ff4081", "#e040fb", "#7c4dff", 
            "#ff80ab", "#ff8a80", "#ea80fc", "#ffffff", "#ffd700"
        ];

        function getRandomLanguageText() {
            const rand = Math.random();
            if (rand < 0.70) return "Seni seviyorum";
            if (rand < 0.80) return "I love you";
            if (rand < 0.90) return "Səni sevirəm";
            return "Я тебя люблю";
        }

        noBtn.addEventListener('click', () => {
            noClickCount++;

            const textSpan = document.createElement('span');
            textSpan.textContent = getRandomLanguageText();
            
            const randomX = Math.random() * 75 + 5;
            const randomY = Math.random() * 80 + 5;
            const randomSize = Math.floor(Math.random() * 24) + 16;
            const randomFont = fonts[Math.floor(Math.random() * fonts.length)];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomRotate = Math.floor(Math.random() * 40) - 20;

            textSpan.style.position = 'absolute';
            textSpan.style.left = randomX + 'vw';
            textSpan.style.top = randomY + 'vh';
            textSpan.style.fontSize = randomSize + 'px';
            textSpan.style.fontFamily = randomFont;
            textSpan.style.color = randomColor;
            textSpan.style.transform = `rotate(${randomRotate}deg)`;
            textSpan.style.fontWeight = 'bold';
            textSpan.style.textShadow = '0 2px 10px rgba(0,0,0,0.6)';
            textSpan.style.transition = 'opacity 0.3s ease';
            textSpan.style.opacity = '0';

            textFxLayer.appendChild(textSpan);

            requestAnimationFrame(() => {
                textSpan.style.opacity = '0.95';
            });

            if (noClickCount === 10) {
                startTextRain();
                createTextFireworks();
            }
        });

        // --- 3. YAZI YAĞMURU ---
        let rainInterval = null;
        function startTextRain() {
            if (rainInterval) return;

            const rainWords = ["Seni seviyorum", "Aşkım", "Birtanem", "Hayatım", "Seni seviyorum ❤️", "💖", "✨", "❤️"];

            rainInterval = setInterval(() => {
                const word = document.createElement('div');
                word.className = 'falling-text';
                word.textContent = rainWords[Math.floor(Math.random() * rainWords.length)];

                const randomX = Math.random() * 90;
                const randomDuration = Math.random() * 3 + 3;
                const randomSize = Math.floor(Math.random() * 16) + 16;
                const randomColor = colors[Math.floor(Math.random() * colors.length)];

                word.style.left = randomX + 'vw';
                word.style.fontSize = randomSize + 'px';
                word.style.color = randomColor;
                word.style.animationDuration = randomDuration + 's';

                textFxLayer.appendChild(word);

                setTimeout(() => { word.remove(); }, randomDuration * 1000);
            }, 250);
        }

        // --- 4. YAZI TABANLI HAVAİ FİŞEK VE KALPLER ---
        function createTextFireworks() {
            const fireworkSymbols = ["❤️", "✨", "💖", "Seni Seviyorum", "💕", "Aşkım", "🌸", "✨"];
            
            for (let burst = 0; burst < 6; burst++) {
                setTimeout(() => {
                    const centerX = Math.random() * (window.innerWidth * 0.8) + window.innerWidth * 0.1;
                    const centerY = Math.random() * (window.innerHeight * 0.5) + window.innerHeight * 0.1;

                    for (let i = 0; i < 18; i++) {
                        const p = document.createElement('div');
                        p.className = 'text-particle';
                        p.textContent = fireworkSymbols[Math.floor(Math.random() * fireworkSymbols.length)];
                        
                        const angle = (Math.PI * 2 / 18) * i;
                        const distance = Math.random() * 150 + 80;
                        const tx = Math.cos(angle) * distance;
                        const ty = Math.sin(angle) * distance;

                        p.style.left = centerX + 'px';
                        p.style.top = centerY + 'px';
                        p.style.setProperty('--tx', `${tx}px`);
                        p.style.setProperty('--ty', `${ty}px`);
                        p.style.color = colors[Math.floor(Math.random() * colors.length)];
                        p.style.fontSize = (Math.random() * 14 + 14) + 'px';

                        textFxLayer.appendChild(p);
                        setTimeout(() => p.remove(), 1500);
                    }
                }, burst * 400);
            }
        }

        // --- 5. EVET BUTONU MANTIĞI ---
        yesBtn.addEventListener('click', () => {
            questionBox.style.display = 'none';
            yesMessage.style.display = 'block';

            createTextFireworks();
            setInterval(createTextFireworks, 2000);
            startTextRain();
        });
    </script>
</body>
</html>
