<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leman & Zeynel ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1f002b 0%, #3d003e 50%, #120024 100%);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas background for fireworks & effects */
        #fxCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
        }

        /* Floating random texts layer */
        #floatingLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        /* Glassmorphism Card */
        .container {
    position: relative;
    z-index: 20;
    width: 90%;
    max-width: 440px;

    background: #410c46;


    border: 1px solid #ffb6c1;
    border-radius: 28px;
    padding: 35px 25px;
    text-align: center;

    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}
        }

        .header-title {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #fe9a8b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: 1px;
            filter: drop-shadow(0 2px 8px rgba(233, 30, 99, 0.4));
        }

        .date-sub {
            font-size: 0.95rem;
            color: #f3d1f4;
            opacity: 0.9;
            margin-bottom: 16px;
        }

        .counter-box {
            background: rgba(233, 30, 99, 0.15);
            border: 1px dashed rgba(255, 105, 180, 0.4);
            border-radius: 16px;
            padding: 12px 15px;
            margin-bottom: 28px;
            font-size: 0.95rem;
            color: #ffe6f7;
        }

        .counter-days {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ff75ac;
            display: inline-block;
            margin: 0 4px;
        }

        .question-box {
            margin-bottom: 10px;
        }

        .question-title {
            font-size: 1.35rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
            margin-bottom: 22px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-yes {
            background: linear-gradient(45deg, #e91e63, #ff6090);
            color: white;
        }

        .btn-yes:hover, .btn-yes:active {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.6);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.15);
            color: #fce4ec;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-no:hover, .btn-no:active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0.98);
        }

        /* Romantic Message when 'Evet' is clicked */
        .yes-message {
            display: none;
            margin-top: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff6090;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 0 15px rgba(255, 96, 144, 0.6);
            line-height: 1.4;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Falling text rain keyframe */
        .falling-word {
            position: fixed;
            top: -60px;
            color: #ff80bf;
            font-weight: bold;
            pointer-events: none;
            z-index: 6;
            white-space: nowrap;
            animation: fallAnimation linear infinite;
            text-shadow: 0 0 8px rgba(255, 105, 180, 0.8);
        }

        @keyframes fallAnimation {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.95;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 18px;
            }
            .header-title {
                font-size: 1.8rem;
            }
            .question-title {
                font-size: 1.2rem;
            }
            .btn {
                padding: 10px 26px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="fxCanvas"></canvas>
    <div id="floatingLayer"></div>

    <div class="container">
        <h1 class="header-title">Leman & Zeynel</h1>
        <p class="date-sub">Sevgili olduğumuz gün: 19 Temmuz 2026</p>

        <div class="counter-box">
            ❤️ Birlikteliğimizde <span id="daysCount" class="counter-days">0</span> gün oldu!
        </div>

        <div id="interactiveArea">
            <div class="question-box" id="questionBox">
                <p class="question-title">Seni sevdiğimi biliyor musun?</p>
                <div class="btn-group">
                    <button class="btn btn-yes" id="yesBtn">Evet</button>
                    <button class="btn btn-no" id="noBtn">Hayır</button>
                </div>
            </div>

            <div class="yes-message" id="yesMessage">
                Evet, seni çok seviyorum aşkım ❤️✨
            </div>
        </div>
    </div>

    <script>
        // --- 1. OTOMATİK GÜN HESAPLAYICI ---
        function updateCounter() {
            const startDate = new Date('2026-07-19T00:00:00');
            const now = new Date();
            const diffTime = now - startDate;
            const diffDays = Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
            
            const daysEl = document.getElementById('daysCount');
            if (daysEl) {
                daysEl.textContent = diffDays;
            }
        }
        updateCounter();
        setInterval(updateCounter, 60000);

        // --- 2. HAYIR BUTONU MANTIĞI ---
        let noClickCount = 0;
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const floatingLayer = document.getElementById('floatingLayer');
        const questionBox = document.getElementById('questionBox');
        const yesMessage = document.getElementById('yesMessage');

        const fonts = [
            "'Segoe UI', sans-serif",
            "Georgia, serif",
            "'Courier New', monospace",
            "Trebuchet MS, sans-serif",
            "Verdana, sans-serif",
            "Comic Sans MS, cursive, sans-serif",
            "Impact, sans-serif"
        ];

        const colors = [
            "#ff75ac", "#ff4081", "#e040fb", "#7c4dff", 
            "#ff80ab", "#ff8a80", "#ea80fc", "#ffffff", "#ffd700"
        ];

        function getRandomLanguageText() {
            const rand = Math.random();
            if (rand < 0.70) return "Seni seviyorum";
            if (rand < 0.80) return "I love you";
            if (rand < 0.90) return "Səni sevirəm";
            return "Я тебя люблю";
        }

        noBtn.addEventListener('click', () => {
            noClickCount++;

            // Rastgele ekrana yazı ekleme
            const textSpan = document.createElement('span');
            textSpan.textContent = getRandomLanguageText();
            
            const randomX = Math.random() * 75 + 5; // %5 - %80
            const randomY = Math.random() * 80 + 5; // %5 - %85
            const randomSize = Math.floor(Math.random() * 24) + 16; // 16px - 40px
            const randomFont = fonts[Math.floor(Math.random() * fonts.length)];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomRotate = Math.floor(Math.random() * 40) - 20;

            textSpan.style.position = 'absolute';
            textSpan.style.left = randomX + 'vw';
            textSpan.style.top = randomY + 'vh';
            textSpan.style.fontSize = randomSize + 'px';
            textSpan.style.fontFamily = randomFont;
            textSpan.style.color = randomColor;
            textSpan.style.transform = `rotate(${randomRotate}deg)`;
            textSpan.style.fontWeight = 'bold';
            textSpan.style.textShadow = '0 2px 10px rgba(0,0,0,0.6)';
            textSpan.style.transition = 'opacity 0.3s ease';
            textSpan.style.opacity = '0';

            floatingLayer.appendChild(textSpan);

            requestAnimationFrame(() => {
                textSpan.style.opacity = '0.95';
            });

            // 10. tıkta yazı yağmuru başlatma
            if (noClickCount === 10) {
                startTextRain();
                triggerHeartBurst();
            }
        });

        // --- 3. YAZI YAĞMURU EFEKTİ (10. Tık Sonrası) ---
        let rainInterval = null;
        function startTextRain() {
            if (rainInterval) return;

            const rainWords = ["Seni seviyorum", "Aşkım", "Birtanem", "Hayatım", "Seni seviyorum ❤️", "💖", "✨"];

            rainInterval = setInterval(() => {
                const word = document.createElement('div');
                word.className = 'falling-word';
                word.textContent = rainWords[Math.floor(Math.random() * rainWords.length)];

                const randomX = Math.random() * 90;
                const randomDuration = Math.random() * 3 + 3; // 3s - 6s
                const randomSize = Math.floor(Math.random() * 16) + 16;
                const randomColor = colors[Math.floor(Math.random() * colors.length)];

                word.style.left = randomX + 'vw';
                word.style.fontSize = randomSize + 'px';
                word.style.color = randomColor;
                word.style.animationDuration = randomDuration + 's';

                floatingLayer.appendChild(word);

                setTimeout(() => {
                    word.remove();
                }, randomDuration * 1000);

            }, 250);
        }

        // --- 4. EVET BUTONU MANTIĞI ---
        yesBtn.addEventListener('click', () => {
            questionBox.style.display = 'none';
            yesMessage.style.display = 'block';
            
            startFireworks();
            triggerHeartBurst();
        });

        // --- 5. CANVAS HAVAİ FİŞEK VE KALP ANİMASYONLARI ---
        const canvas = document.getElementById('fxCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];

        class Particle {
            constructor(x, y, color, speed, angle, gravity, friction, shape = 'circle') {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = gravity;
                this.friction = friction;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.008;
                this.shape = shape;
                this.size = Math.random() * 4 + 2;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;

                if (this.shape === 'heart') {
                    ctx.font = `${this.size * 4}px serif`;
                    ctx.fillText('❤️', this.x, this.y);
                } else if (this.shape === 'sparkle') {
                    ctx.font = `${this.size * 3}px serif`;
                    ctx.fillText('✨', this.x, this.y);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function createFirework(x, y) {
            const particleCount = 50;
            const hueColors = ['#ff4081', '#ff80ab', '#e040fb', '#ffd700', '#ffffff', '#ff1744'];

            for (let i = 0; i < particleCount; i++) {
                const color = hueColors[Math.floor(Math.random() * hueColors.length)];
                const speed = Math.random() * 8 + 2;
                const angle = Math.random() * Math.PI * 2;
                const shapeRand = Math.random();
                let shape = 'circle';
                if (shapeRand > 0.8) shape = 'heart';
                else if (shapeRand > 0.6) shape = 'sparkle';

                particles.push(new Particle(x, y, color, speed, angle, 0.08, 0.96, shape));
            }
        }

        function triggerHeartBurst() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * (canvas.height * 0.6);
                    createFirework(x, y);
                }, i * 300);
            }
        }

        let fireworkInterval = null;
        function startFireworks() {
            triggerHeartBurst();
            if (!fireworkInterval) {
                fireworkInterval = setInterval(() => {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * (canvas.height * 0.5);
                    createFirework(x, y);
                }, 700);
            }
        }

        function animateFX() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animateFX);
        }

        animateFX();
    </script>
</body>
</html>
